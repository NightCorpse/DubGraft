name: Publish to PyPI

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Reject prereleases
        if: github.event.release.prerelease
        run: |
          echo "::error::PyPI publication requires a final GitHub Release."
          exit 1

      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from packaging.version import Version
          from dubgraft import __version__

          version = Version(__version__)
          tag = os.environ["RELEASE_TAG"]
          if version.is_prerelease or version.is_devrelease:
              raise SystemExit(f"package version is not final: {version}")
          if tag != f"v{version}":
              raise SystemExit(
                  f"release tag {tag!r} does not match package version {version!s}"
              )
          PY

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: pypi-distributions-${{ github.event.release.tag_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/dubgraft
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: pypi-distributions-${{ github.event.release.tag_name }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
