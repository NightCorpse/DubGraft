[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dubgraft"
dynamic = ["version"]
description = "Align and graft dubbed audio across media releases using distributed audio anchors."
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [
  { name = "NightCorpse" },
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "scipy-stubs>=1.12,<2",
]

[project.scripts]
dubgraft = "dubgraft.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.package-data]
dubgraft = ["data/*.csv"]

[tool.setuptools.dynamic]
version = { attr = "dubgraft.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --cov=dubgraft --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["dubgraft"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
files = ["src/dubgraft"]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
